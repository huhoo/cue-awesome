name: skill-lint

# 全仓结构与 frontmatter 门禁：任何人 push / 开 PR 都跑。
# 加新 skill 不需要改这里 —— 顶层含 SKILL.md 的目录会被自动发现。
# 只依赖标准库（PyYAML 可用时用，不可用则回退简易解析）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML (optional, improves frontmatter parsing)
        run: python -m pip install --quiet pyyaml || true

      - name: Repo skill lint
        run: python scripts/check_skills.py

      # 公开面卫生闸（CONTRIBUTING §公开面卫生 的可执行形，M199）。
      # 闸本体必须先自证非恒真——这一步永远是硬门。
      - name: Public-surface hygiene gate selftest (guard samples)
        run: python -B scripts/check_public_hygiene.py --selftest

      # 全仓扫描现为报账态：成品面 68 条 ERROR 是 M198 的清理清单。
      # M198 交卷清零后，删掉 continue-on-error 这一行，本步即成发布硬门。
      - name: Public-surface hygiene scan (blocking after M198 clears)
        run: python -B scripts/check_public_hygiene.py
        continue-on-error: true

      - name: Ontology regression suite
        run: python -B cue-omni-ontology/scripts/test_ontology.py

      - name: Ontology numeric pack tests
        run: python -B cue-omni-ontology/scripts/test_numeric.py

      - name: cue-lead-pieces regression test (offline)
        run: python -B cue-lead-pieces/scripts/test_skill_regression.py
